# Reverse proxy de Lisolo : SEUL point d'entrée (HTTPS 443).
#
#   https://<hôte>/            → fichiers statiques du frontend (build de production)
#   https://<hôte>/api/        → backend Node (sur Windows, port 4000)
#   https://<hôte>/socket.io/  → backend, WebSocket (chat temps réel)
#   https://<hôte>/peerjs/     → backend, WebSocket (signalisation des appels)
#   https://<hôte>/media/      → MinIO (URL présignées d'envoi et de lecture)

# WebSocket : si le client demande « Upgrade: websocket », on transmet « Connection: upgrade » ;
# sinon « Connection: close » (requête HTTP classique).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Le backend tourne sur l'hôte Windows (npm run dev / npm start), pas dans Docker.
upstream backend {
    server host.docker.internal:4000;
}

# HTTP : uniquement une redirection vers HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Certificats générés par mkcert (scripts/gen-certs.ps1), montés en lecture seule, jamais commités.
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Par défaut, petites requêtes seulement (JSON de l'API). Les fichiers passent par /media/.
    client_max_body_size 1m;

    # En-têtes transmis au backend : qui est le vrai client, et par quelle adresse il est venu.
    # $http_host = l'en-tête Host d'origine (avec le port s'il y en a un).
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;

    # ---------- Frontend (build Vite) ----------
    root /usr/share/nginx/html;

    location / {
        # Application monopage : toute route inconnue (/login, /register…) renvoie index.html.
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache"; # toujours la dernière version
    }

    # Service worker des notifications push : jamais en cache, sinon une nouvelle version
    # ne serait jamais récupérée. Servi à la racine pour que sa portée couvre tout le site.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        # Noms de fichiers avec empreinte (index-BQjYxQvW.js) : cache d'un an sans risque.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- API REST ----------
    location /api/ {
        proxy_pass http://backend;
    }

    # ---------- WebSocket : Socket.io et PeerJS ----------
    # HTTP/1.1 obligatoire (le mécanisme Upgrade n'existe pas en HTTP/1.0, valeur par défaut
    # de proxy_pass), en-têtes Upgrade/Connection retransmis explicitement (ce sont des en-têtes
    # « hop-by-hop » que Nginx supprime sinon), et délais longs : une connexion WebSocket
    # peut rester ouverte des heures sans trafic HTTP.
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /peerjs/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # ---------- MinIO : URL présignées (bucket « media ») ----------
    # Le chemin S3 « /media/users/<id>/<uuid> » est transmis tel quel à MinIO.
    location /media/ {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # La signature de l'URL inclut l'hôte : MinIO doit recevoir EXACTEMENT
        # l'en-tête Host que le navigateur a utilisé (ex. 192.168.1.42).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host "";
        # Plus gros fichier autorisé à l'étape 7 : documents de 100 Mo (+ marge).
        client_max_body_size 101m;
        # Le fichier est transmis à MinIO au fil de l'eau, sans être d'abord écrit sur le disque de Nginx.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
