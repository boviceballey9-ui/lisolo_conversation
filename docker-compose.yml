# Infrastructure locale du clone WhatsApp.
# Les valeurs ${...} viennent du fichier .env à la racine (copie de .env.example).
#
# Point d'entrée UNIQUE depuis le réseau : nginx (443, et 80 qui redirige vers 443).
# Les autres ports ne sont publiés que sur 127.0.0.1 (le PC lui-même), sauf coturn :
# le son et l'image des appels (UDP) ne peuvent pas passer par Nginx.

services:
  # Base de données relationnelle : utilisateurs, conversations, messages...
  postgres:
    image: postgres:16-alpine
    container_name: wa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432" # port Windows : port interne du conteneur (local seulement)
    volumes:
      - pgdata:/var/lib/postgresql/data # volume persistant : les données survivent aux redémarrages
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Stockage objet compatible S3 : photos, vidéos, notes vocales, documents.
  minio:
    # minio/minio a été retiré de Docker Hub : on utilise l'image Chainguard.
    # Son entrypoint est /usr/bin/minio, donc "command" ne contient que les arguments.
    # Elle tourne en utilisateur non-root 65532 : on utilise un volume nommé (pas un dossier local).
    image: cgr.dev/chainguard/minio:latest
    container_name: wa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Le navigateur envoie les fichiers à MinIO via des URL présignées. Derrière Nginx c'est
      # la même origine (https://<hôte>/media/…) ; en développement avec Vite (localhost:5173 →
      # localhost:9000) c'est une autre origine : MinIO doit l'autoriser (CORS).
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:9000:9000" # API S3 (backend, et Vite en développement) ; depuis le réseau : via Nginx /media/
      - "127.0.0.1:9001:9001" # Console web d'administration : sur le PC uniquement
    volumes:
      - miniodata:/data

  # Serveur STUN/TURN pour les appels audio/vidéo WebRTC.
  coturn:
    image: coturn/coturn:latest
    container_name: wa-coturn
    restart: unless-stopped
    # Docker Desktop (Windows/macOS) ne supporte pas bien network_mode: host,
    # on publie donc explicitement le port 3478 et une petite plage de relais.
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    # Pas de turnserver.conf : toute la configuration est passée en arguments.
    # (Ne pas ajouter "-n" : l'entrypoint de l'image le transforme en argument vide.)
    command:
      - --listening-port=3478
      # Identifiants TEMPORAIRES (« TURN REST API ») : le backend fabrique
      # username = "<expiration>:<userId>" et password = HMAC-SHA1(TURN_SECRET, username).
      # coturn refait le calcul avec le même secret : aucun mot de passe fixe dans le navigateur.
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${TURN_REALM}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --log-file=stdout

  # Reverse proxy HTTPS : sert le frontend (build de production) et route vers le backend et MinIO.
  nginx:
    build:
      context: . # racine du dépôt : l'image construit aussi le frontend
      dockerfile: nginx/Dockerfile
    container_name: wa-nginx
    restart: unless-stopped
    ports:
      - "80:80" # redirection vers HTTPS
      - "443:443"
    volumes:
      # Certificats mkcert (scripts/gen-certs.ps1), en lecture seule, jamais dans l'image ni dans Git.
      - ./nginx/certs:/etc/nginx/certs:ro
    extra_hosts:
      # Le backend tourne sur Windows : « host.docker.internal » désigne le PC hôte.
      - "host.docker.internal:host-gateway"
    depends_on:
      - minio

volumes:
  pgdata:
  miniodata:
